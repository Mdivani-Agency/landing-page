# Lint, test, and build are required checks for every push and merge request.
# Production deploys happen from this pipeline via the Vercel CLI, and the
# Vercel Git integration is disabled for the production branch in vercel.json,
# so a red pipeline can never reach production.

image: node:22

stages:
  - check
  - migrate
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Always run a branch pipeline on the default branch, even when an MR is
    # open from it (e.g. development -> main): deploy_production only runs in
    # branch pipelines, so suppressing it would freeze production deploys.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Avoid duplicate branch + MR pipelines for the same commit.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  # Keep the Yarn 4 download cache inside the project dir so GitLab can cache it.
  YARN_ENABLE_GLOBAL_CACHE: "false"

default:
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache
  before_script:
    - node .yarn/releases/yarn-4.9.2.cjs install --immutable

lint:
  stage: check
  interruptible: true
  script:
    - node .yarn/releases/yarn-4.9.2.cjs lint

test:
  stage: check
  interruptible: true
  script:
    - node .yarn/releases/yarn-4.9.2.cjs test

build:
  stage: check
  interruptible: true
  script:
    - node .yarn/releases/yarn-4.9.2.cjs build

# Applies pending SQL in supabase/migrations/ to the linked hosted project.
# Runs on every default-branch pipeline after lint, test, and build pass,
# and before deploy_production. db push is idempotent, so gating on a
# migration-file glob would skip retries after a failed apply. Requires
# SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF (protected and masked,
# available on the protected default branch — not production-only).
migrate_supabase:
  stage: migrate
  interruptible: false
  # Serialize applies so two default-branch pipelines cannot race db push.
  resource_group: supabase-migrations
  # Skip the default yarn install — this job only needs the Supabase CLI.
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - lint
    - test
    - build
  script:
    - |
      if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
        echo "SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set as CI/CD variables."
        exit 1
      fi
    - npx --yes supabase@2.116.0 link --yes --project-ref "$SUPABASE_PROJECT_REF"
    - npx --yes supabase@2.116.0 db push --yes --linked

# Deploys the default branch to production after lint, test, and build pass.
# Requires VERCEL_TOKEN and VERCEL_PROJECT_ID (protected, masked, scoped
# to the "production" environment). The CLI is pinned in devDependencies
# and reads VERCEL_TOKEN from the environment, keeping the token off argv.
#
# Hobby personal account: do not pass --scope (the dashboard path is a
# username; northstar rejects a personal account as --scope). --project
# uses the GitLab VERCEL_PROJECT_ID variable. Unset VERCEL_ORG_ID before
# the CLI so a username-as-org-id cannot make getOrgById miss. The
# preflight is diagnostic only and must not print id values.
deploy_production:
  stage: deploy
  # Serialize production deploys so an older pipeline can never finish after
  # (and overwrite) a newer one.
  resource_group: vercel-production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - lint
    - test
    - build
    - job: migrate_supabase
      optional: true
  environment:
    name: production
    url: https://mdivani.agency
  script:
    - |
      if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
        echo "VERCEL_TOKEN and VERCEL_PROJECT_ID must be set as production CI/CD variables."
        exit 1
      fi
    - |
      node --input-type=module <<'NODE'
      const token = process.env.VERCEL_TOKEN;
      const project = process.env.VERCEL_PROJECT_ID || "";
      const envOrg = process.env.VERCEL_ORG_ID || "";
      const headers = { Authorization: `Bearer ${token}` };
      async function readJson(res) {
        const text = await res.text();
        try {
          return text ? JSON.parse(text) : {};
        } catch {
          return { error: { message: `non-JSON ${res.status}` } };
        }
      }
      try {
        const userRes = await fetch("https://api.vercel.com/v2/user", { headers });
        const userBody = await readJson(userRes);
        const user = userBody.user || {};
        if (!userRes.ok) {
          console.log(`Vercel preflight ${userRes.status}: cannot read /v2/user.`);
        } else {
          console.log(`VERCEL_ORG_ID matches token user id: ${envOrg === user.id}`);
          console.log(`VERCEL_ORG_ID equals username: ${Boolean(user.username) && envOrg === user.username}`);
        }
        const projectRes = await fetch(
          `https://api.vercel.com/v9/projects/${encodeURIComponent(project)}`,
          { headers }
        );
        const projectBody = await readJson(projectRes);
        if (!projectRes.ok) {
          console.log(`Vercel preflight ${projectRes.status}: cannot confirm VERCEL_PROJECT_ID on the token's personal account.`);
        } else {
          console.log(`VERCEL_ORG_ID matches project accountId: ${envOrg === (projectBody.accountId || "")}`);
          console.log(`VERCEL_PROJECT_ID matches live project: ${project === (projectBody.id || "")}`);
        }
      } catch (err) {
        console.log("Vercel preflight failed; continuing with --project.");
      }
      NODE
    - unset VERCEL_ORG_ID
    - node .yarn/releases/yarn-4.9.2.cjs run vercel -- pull --yes --environment=production --project "$VERCEL_PROJECT_ID"
    - node .yarn/releases/yarn-4.9.2.cjs run vercel -- build --prod --project "$VERCEL_PROJECT_ID"
    - node .yarn/releases/yarn-4.9.2.cjs run vercel -- deploy --prebuilt --prod --project "$VERCEL_PROJECT_ID"
