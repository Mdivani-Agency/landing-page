# Lint, test, and build are required checks for every push and merge request.
# Production deploys happen from this pipeline via the Vercel CLI, and the
# Vercel Git integration is disabled for the production branch in vercel.json,
# so a red pipeline can never reach production.

image: node:22

stages:
  - check
  - migrate
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Always run a branch pipeline on the default branch, even when an MR is
    # open from it (e.g. development -> main): deploy_production only runs in
    # branch pipelines, so suppressing it would freeze production deploys.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Avoid duplicate branch + MR pipelines for the same commit.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  # Keep the Yarn 4 download cache inside the project dir so GitLab can cache it.
  YARN_ENABLE_GLOBAL_CACHE: "false"

default:
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache
  before_script:
    - node .yarn/releases/yarn-4.9.2.cjs install --immutable

lint:
  stage: check
  interruptible: true
  script:
    - node .yarn/releases/yarn-4.9.2.cjs lint

test:
  stage: check
  interruptible: true
  script:
    - node .yarn/releases/yarn-4.9.2.cjs test

build:
  stage: check
  interruptible: true
  script:
    - node .yarn/releases/yarn-4.9.2.cjs build

# Applies pending SQL in supabase/migrations/ to the linked hosted project.
# Runs on every default-branch pipeline after lint, test, and build pass,
# and before deploy_production. db push is idempotent, so gating on a
# migration-file glob would skip retries after a failed apply. Requires
# SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF (protected and masked,
# available on the protected default branch — not production-only).
migrate_supabase:
  stage: migrate
  interruptible: false
  # Serialize applies so two default-branch pipelines cannot race db push.
  resource_group: supabase-migrations
  # Skip the default yarn install — this job only needs the Supabase CLI.
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - lint
    - test
    - build
  script:
    - |
      if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
        echo "SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set as CI/CD variables."
        exit 1
      fi
    - npx --yes supabase@2.116.0 link --yes --project-ref "$SUPABASE_PROJECT_REF"
    - npx --yes supabase@2.116.0 db push --yes --linked

# Deploys the default branch to production after lint, test, and build pass.
# Requires VERCEL_TOKEN (protected, masked, scoped to the "production"
# environment). The CLI is pinned in devDependencies and reads VERCEL_TOKEN
# from the environment, keeping the token off the process argv.
#
# --scope / --project are the live Vercel team slug and project id (from the
# Vercel-for-GitLab payload). They override VERCEL_ORG_ID / VERCEL_PROJECT_ID
# because getOrgById only accepts team_* or the authenticated user id — a
# dashboard slug such as mdivani1 becomes "Project not found". The preflight
# is diagnostic only and must not fail the job. Keep the CI variables in
# sync with Project Settings so other tooling still works.
deploy_production:
  stage: deploy
  # Serialize production deploys so an older pipeline can never finish after
  # (and overwrite) a newer one.
  resource_group: vercel-production
  variables:
    VERCEL_DEPLOY_SCOPE: mdivani1
    VERCEL_DEPLOY_PROJECT: prj_bPLLh4NEuwpEr070HwOvLdL4jV1l
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - lint
    - test
    - build
    - job: migrate_supabase
      optional: true
  environment:
    name: production
    url: https://mdivani.agency
  script:
    - |
      node --input-type=module <<'NODE'
      const token = process.env.VERCEL_TOKEN;
      const scope = process.env.VERCEL_DEPLOY_SCOPE;
      const project = process.env.VERCEL_DEPLOY_PROJECT;
      const envOrg = process.env.VERCEL_ORG_ID || "";
      const envPrj = process.env.VERCEL_PROJECT_ID || "";
      if (!token) {
        console.error("VERCEL_TOKEN must be set as a production CI/CD variable.");
        process.exit(1);
      }
      const teamQuery = scope.startsWith("team_")
        ? `teamId=${encodeURIComponent(scope)}`
        : `slug=${encodeURIComponent(scope)}`;
      const url = `https://api.vercel.com/v9/projects/${encodeURIComponent(project)}?${teamQuery}`;
      try {
        const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        const text = await res.text();
        let body = {};
        try {
          body = text ? JSON.parse(text) : {};
        } catch {
          body = { error: { message: text.slice(0, 300) || `non-JSON ${res.status}` } };
        }
        if (!res.ok) {
          console.log(`Vercel preflight ${res.status}: cannot confirm project ${project} under ${scope}.`);
          console.log(body?.error?.message || JSON.stringify(body));
          console.log("Continuing with --scope/--project; preflight is diagnostic only.");
        } else {
          const liveOrg = body.accountId || "";
          const livePrj = body.id || "";
          console.log(`Vercel project reachable: ${body.name} (${livePrj}) under ${liveOrg}`);
          console.log(`VERCEL_ORG_ID starts with team_: ${envOrg.startsWith("team_")}`);
          console.log(`VERCEL_ORG_ID matches live accountId: ${envOrg === liveOrg}`);
          console.log(`VERCEL_PROJECT_ID starts with prj_: ${envPrj.startsWith("prj_")}`);
          console.log(`VERCEL_PROJECT_ID matches live project: ${envPrj === livePrj}`);
          if (envOrg !== liveOrg || envPrj !== livePrj) {
            console.log("GitLab VERCEL_ORG_ID / VERCEL_PROJECT_ID do not match the live project.");
            console.log("VERCEL_ORG_ID must be the team id (team_...), not the dashboard slug (mdivani1).");
            console.log(`Expected VERCEL_ORG_ID=${liveOrg}`);
            console.log(`Expected VERCEL_PROJECT_ID=${livePrj}`);
            console.log("Continuing with --scope/--project so this mismatch cannot block the deploy.");
          }
        }
      } catch (err) {
        console.log(`Vercel preflight failed: ${err?.message || err}`);
        console.log("Continuing with --scope/--project; preflight is diagnostic only.");
      }
      NODE
    - node .yarn/releases/yarn-4.9.2.cjs run vercel -- pull --yes --environment=production --scope "$VERCEL_DEPLOY_SCOPE" --project "$VERCEL_DEPLOY_PROJECT"
    - node .yarn/releases/yarn-4.9.2.cjs run vercel -- build --prod --scope "$VERCEL_DEPLOY_SCOPE" --project "$VERCEL_DEPLOY_PROJECT"
    - node .yarn/releases/yarn-4.9.2.cjs run vercel -- deploy --prebuilt --prod --scope "$VERCEL_DEPLOY_SCOPE" --project "$VERCEL_DEPLOY_PROJECT"
