<div id="cookie-consent" class="hidden fixed bottom-0 left-0 right-0 p-4 bg-blur text-white">
    <p class="text-md font-medium">
        We use cookies to improve your experience on our site. By using our site you accept our
        <button onclick="openPrivacyModal()" class="underline text-secondary" target="_blank">Privacy Policy</button>.
    </p>
    <button autofocus id="accept-cookies" onclick="acceptCookies()" class="text-sm text-black bg-white p-1 px-2 mt-2 mr-1 rounded-sm">Accept Cookies</button>
    <button id="reject-cookies" onclick="rejectCookies()" class="text-sm bg-transparent border border-stroke p-1 px-2 mt-2 rounded-sm">Reject Cookies</button>
</div>
