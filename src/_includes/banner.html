<div id="cookie-consent" class="hidden fixed bottom-0 left-0 right-0 p-2 bg-gray-800 text-white">
    <p class="text-md font-medium">
        We use cookies to improve your experience on our site. By using our site you accept our
        <button onclick="openPrivacyModal()" class="underline" target="_blank">Privacy Policy</button>.
    </p>
    <button id="accept-cookies" onclick="acceptCookies()" class="text-sm bg-blue-500 p-1 mt-2 mr-1 rounded">Accept Cookies</button>
    <button id="reject-cookies" onclick="rejectCookies()" class="text-sm bg-red-500 p-1 mt-2 rounded">Reject Cookies</button>
</div>
