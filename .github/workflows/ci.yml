# Lint, test, and build are required checks for every pull request and for
# pushes to development. Production deploys happen from this workflow via the
# Vercel CLI, and the Vercel Git integration is disabled for the production
# branch in vercel.json, so a red pipeline can never reach production.
#
# Trigger shape avoids duplicate PR + push pipelines: feature-branch work
# runs on pull_request; development runs on push (checks, then migrate and
# deploy). Open a PR to get checks on a feature branch.

name: CI

on:
  pull_request: {}
  push:
    branches:
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the Yarn 4 download cache inside the project dir so Actions can cache it.
  YARN_ENABLE_GLOBAL_CACHE: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - run: node .yarn/releases/yarn-4.9.2.cjs lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - run: node .yarn/releases/yarn-4.9.2.cjs test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - run: node .yarn/releases/yarn-4.9.2.cjs build

  # Applies pending SQL in supabase/migrations/ to the linked hosted project.
  # Runs on every development-branch push after lint, test, and build pass,
  # and before deploy_production. db push is idempotent, so gating on a
  # migration-file glob would skip retries after a failed apply. Requires
  # repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF
  # (not production-environment-only).
  migrate_supabase:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs:
      - lint
      - test
      - build
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require Supabase secrets
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set as GitHub Actions secrets."
            exit 1
          fi
      - run: npx --yes supabase@2.116.0 link --yes --project-ref "$SUPABASE_PROJECT_REF"
      - run: npx --yes supabase@2.116.0 db push --yes --linked

  # Deploys development to production after lint, test, and build pass.
  # Requires VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID on the
  # GitHub Environment named production. .vercel/ is not in the repo, so
  # the CLI resolves the project link from those env vars. The CLI is
  # pinned in devDependencies and reads VERCEL_TOKEN from the environment,
  # keeping the token off argv.
  deploy_production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs:
      - lint
      - test
      - build
      - migrate_supabase
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://mdivani.agency
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - name: Require Vercel secrets
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID must be set as production environment secrets."
            exit 1
          fi
      - run: node .yarn/releases/yarn-4.9.2.cjs run vercel pull --yes --environment=production
      - run: node .yarn/releases/yarn-4.9.2.cjs run vercel build --prod
      - run: node .yarn/releases/yarn-4.9.2.cjs run vercel deploy --prebuilt --prod
